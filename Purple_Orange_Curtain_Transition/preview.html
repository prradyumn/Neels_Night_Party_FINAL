<!DOCTYPE html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Curtain opening preview</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-content:center;background:#171125;color:#f6e8d5;font:16px system-ui}.stage{width:min(94vw,1100px);aspect-ratio:16/9;position:relative;overflow:hidden;border-radius:16px;background:radial-gradient(ellipse at 50% 15%,#493768,#211a36 70%);box-shadow:0 24px 100px #0008}.stage::before{content:"Your next game scene";position:absolute;inset:0;display:grid;place-content:center;color:#dbcced;font-size:clamp(18px,3vw,36px);letter-spacing:.03em}.stage img{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}footer{display:flex;justify-content:space-between;align-items:center;padding:20px 3px;gap:20px}button{background:#f6b544;color:#321247;padding:12px 25px;border:0;border-radius:99px;font:700 15px system-ui;cursor:pointer}small{color:#bcb0ca}</style><main><div class="stage"><img id="curtain" src="curtain-opening.svg" alt="Purple and orange curtain opening"></div><footer><button id="replay">Replay opening</button><small>1920 × 1080 · 2.65 seconds · transparent overlay</small></footer></main><script>document.querySelector('#replay').onclick=()=>{const i=document.querySelector('#curtain');i.src='curtain-opening.svg?replay='+Date.now()}</script></html>
